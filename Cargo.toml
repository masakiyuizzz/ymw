[package]
name = "ymw"
version = "0.0.1"
edition = "2021"
description = "终端里的浏览器：headless Chromium 渲染，画面画进终端 · a terminal web browser driven by headless Chromium"
license = "MIT"
authors = ["masakiyuizzz"]
repository = "https://github.com/masakiyuizzz/ymw"
readme = "README.md"
exclude = ["/.workbuddy", "/dist"]
keywords = ["tui", "browser", "chromium", "terminal", "kitty"]
categories = ["command-line-utilities", "web-programming"]
rust-version = "1.75"

[[bin]]
name = "ymw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
ratatui = "0.29"
serde_json = "1"
unicode-width = "0.2"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
